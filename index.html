<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>曾苏展的第一张网页</title>
  <style>
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #dce5e5;
    margin: 40px;
  }
  h1 { color: #1a2330; }
  p { color: #555; line-height: 1.6; }
  img { border-radius: 12px; }
    img {
    border: 4px solid black;
    padding: 8px;
    margin: 8px;
  }
    .row { display: flex; gap: 12px; align-items: center; }
  input, button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }
  button { background: #0dd5bd; color: white; }
  body.dark { background: #e08e0b; color: #eeeeee; }
  body.dark h1 { color: #ffffff; }
  body.dark p { color: #bbbbbb; }
  body.dark a { color: #d4875a; }
  .bow { display: flex; gap: 12px; align-items: center; }
   button {padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;}
</style>
</head>
<body>
  <h1 id="bt">你好，我是曾苏展</h1>
  <p id="bt2">一名产品经理，正在学前端。</p>
  <h2>关于我</h2>
  <ul>
    <li>坐标：浙江省杭州市</li>
    <li>爱好：运动</li>
  </ul>
  <h2>这是我公司的logo</h2>
  <img src="https://t14.baidu.com/it/u=1703765446,3375837608&fm=224&app=112&f=JPEG?w=500&h=399">
<div>
 <a href="https://www.runoob.com">常查的教程站</a>
</div>
<div class="bow">
<button id="themeBtn1">要不要点一下？</button>
</div>
<div class="row">
  <input placeholder="搜索点什么">
 <button id="themeBtn">点我</button>
</div>
<script>
  // 变量：记录点击次数
  let count = 0;

  // 函数：定义"切换主题 + 更新按钮文字"的流程
  function toggleTheme() {
    document.body.classList.toggle("dark");
    count = count + 1;
    document.getElementById("themeBtn").textContent = "点我（已点 " + count + " 次）";
  }

  // 事件：按钮被点击时，执行上面的函数
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
</script>
<script>
  //函数：点击以后切换文字的流程
  function toggleTheme() {
    document.getElementById("bt").textContent = "你不好，我不是曾苏展"
    document.getElementById("bt2").textContent = "不是一名产品经理，没有在学前端"
  }
  
  //事件：按钮点击时，执行上面的函数
  document.getElementById("themeBtn1").addEventListener("click",toggleTheme)
</script>
</body>
</html>
